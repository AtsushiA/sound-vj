<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio VJ - パーティクルビジュアライザー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <canvas id="canvas"></canvas>
        
        <!-- フルスクリーン時の操作ヒント -->
        <div class="fullscreen-overlay">
            右端にマウスを移動するとメニューが表示されます | ESCキーでフルスクリーン終了
        </div>
        
        <!-- コントロールパネル -->
        <div id="controls">
            <div class="control-section">
                <h3>オーディオ設定</h3>
                <label>感度: <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="1"></label>
                <label>周波数範囲: <select id="frequencyRange">
                    <option value="low">低音域</option>
                    <option value="mid" selected>中音域</option>
                    <option value="high">高音域</option>
                    <option value="full">全域</option>
                </select></label>
            </div>

            <div class="control-section">
                <h3>ビジュアル設定</h3>
                <label>モード: <select id="visualMode">
                    <option value="fluid">流体</option>
                    <option value="circular">円形</option>
                    <option value="radial">放射状</option>
                    <option value="particles" selected>パーティクル</option>
                    <option value="waves">ウェーブ</option>
                    <option value="spectrum">スペクトラム</option>
                </select></label>
                <label>流体強度: <input type="range" id="flowIntensity" min="0.1" max="3" step="0.1" value="1.5"></label>
                <label>波の振幅: <input type="range" id="waveAmplitude" min="10" max="200" value="50"></label>
            </div>

            <div class="control-section">
                <h3>パーティクル設定</h3>
                <label>形状: <select id="particleShape">
                    <option value="circle">円</option>
                    <option value="square">四角</option>
                    <option value="triangle">三角</option>
                    <option value="star">星</option>
                    <option value="wapuu_random" selected>わぷー (ランダム)</option>
                </select></label>
                <label>サイズ: <input type="range" id="particleSize" min="1" max="50" value="10"></label>
                <label>数量: <input type="range" id="particleCount" min="10" max="500" value="100"></label>
                <label>寿命: <input type="range" id="particleLife" min="0.5" max="5" step="0.1" value="2"></label>
            </div>

            <div class="control-section">
                <h3>エフェクト</h3>
                <label>重力: <input type="range" id="gravity" min="-2" max="2" step="0.1" value="0.1"></label>
                <label>風: <input type="range" id="wind" min="-2" max="2" step="0.1" value="0"></label>
                <label>回転: <input type="checkbox" id="rotation"></label>
                <label>トレイル: <input type="checkbox" id="trail" checked></label>
                <label>ブルーム: <input type="checkbox" id="bloom"></label>
            </div>

            <div class="control-section">
                <h3>カラー設定</h3>
                <label>カラーモード: <select id="colorMode">
                    <option value="rainbow" selected>レインボー</option>
                    <option value="fire">炎</option>
                    <option value="ocean">海</option>
                    <option value="neon">ネオン</option>
                    <option value="custom">カスタム</option>
                </select></label>
                <label>メインカラー: <input type="color" id="mainColor" value="#ff0080"></label>
                <label>サブカラー: <input type="color" id="subColor" value="#0080ff"></label>
                <label>透明度: <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8"></label>
            </div>

            <div class="control-section">
                <h3>プリセット</h3>
                <input type="text" id="presetName" placeholder="プリセット名">
                <button id="savePreset">保存</button>
                <select id="presetList">
                    <option value="">プリセットを選択</option>
                </select>
                <button id="loadPreset">読み込み</button>
                <button id="deletePreset">削除</button>
            </div>

            <div class="control-section">
                <button id="startStop">開始</button>
                <button id="fullscreen">フルスクリーン</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
